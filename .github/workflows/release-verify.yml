name: Release verify
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v
        required: true
        type: string
      platform:
        description: Target platform
        required: true
        type: choice
        options: [macos-arm64, linux-x64, windows-x64]
      cyna_version:
        description: Verified Cyna distribution version
        required: true
        default: 0.5.1-beta.2
        type: string
      mode:
        description: Gate mode
        required: true
        type: choice
        options: [preflight, verify]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use lockfile npm version
        run: npm install --global npm@10.9.4
      - uses: oven-sh/setup-bun@v2
      - name: Source preflight
        env:
          VERSION: ${{ inputs.version }}
        run: node tools/release.mjs plan --version="$VERSION" --preflight-only
  verify:
    needs: preflight
    if: inputs.mode == 'verify'
    runs-on: ${{ inputs.platform == 'linux-x64' && 'ubuntu-24.04' || inputs.platform == 'windows-x64' && 'windows-2025' || 'macos-26' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use lockfile npm version
        run: npm install --global npm@10.9.4
      - uses: oven-sh/setup-bun@v2
      - name: Runner architecture preflight
        run: |
          node -e 'const expected = {"macos-arm64":"darwin-arm64","linux-x64":"linux-x64","windows-x64":"win32-x64"}[process.env.RELEASE_PLATFORM]; if (`${process.platform}-${process.arch}` !== expected) process.exit(1)'
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Cyna toolchain
        if: inputs.platform != 'windows-x64'
        env:
          CYNA_INSTALL_ROOT: ${{ runner.temp }}/cyna
          CYNA_VERSION: ${{ inputs.cyna_version }}
          CYNA_HOST: ${{ inputs.platform == 'linux-x64' && 'x86_64-unknown-linux-gnu' || 'aarch64-apple-darwin' }}
        run: |
          curl -fsSL https://cyna.dev/install.sh | sh -s -- "$CYNA_VERSION" "$CYNA_HOST"
          echo "$CYNA_INSTALL_ROOT/current/bin" >> "$GITHUB_PATH"
      - name: Install verified Windows Cyna distribution
        if: inputs.platform == 'windows-x64'
        shell: pwsh
        env:
          CYNA_VERSION: ${{ inputs.cyna_version }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cyna'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $archive = Join-Path $root 'distribution.tar.gz'
          $url = "https://downloads.cyna.dev/distributions/$env:CYNA_VERSION/x86_64-pc-windows-gnu.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xzf $archive -C $root
          $bin = Join-Path $root 'x86_64-pc-windows-gnu/bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Build platform binary
        if: inputs.platform == 'linux-x64' || inputs.platform == 'windows-x64'
        run: npm run build:cyna
      - name: Plan and verify
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node tools/release.mjs plan --version="$VERSION"
          node tools/release.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: weiv-verified-${{ inputs.version }}-${{ inputs.platform }}
          path: dist/release/artifacts/*
          if-no-files-found: error
          retention-days: 7
