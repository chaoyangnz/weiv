name: Publish Supported Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and release metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(node -p "require('./packages/weiv/package.json').version")"
          test "$actual" = "$VERSION"
          tag="v${VERSION}"
          git rev-parse "$tag"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-darwin-arm64:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate macOS ARM64 package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual="$(node -p "require('./packages/weiv-darwin-arm64/package.json').version")"
          test "$actual" = "$VERSION"
          file packages/weiv-darwin-arm64/bin/weiv | grep -q 'Mach-O 64-bit arm64'

      - name: Upload macOS ARM64 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            "packages/weiv-darwin-arm64/bin/weiv#weiv-darwin-arm64" --clobber

      - name: Publish macOS ARM64 package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package="@weivjs/weiv-darwin-arm64"
          if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
            echo "${package}@${VERSION} already published"
          else
            npm publish ./packages/weiv-darwin-arm64 --access public
          fi

  publish-main:
    needs:
      - publish-darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2

      - name: Publish main package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          package="weivjs"
          actual="$(node -p "require('./packages/weiv/package.json').version")"
          test "$actual" = "$VERSION"
          if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
            echo "${package}@${VERSION} already published"
          else
            npm publish ./packages/weiv --access public
          fi
